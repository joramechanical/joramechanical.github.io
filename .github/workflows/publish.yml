name: Publish office-panel articles
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish-panel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/publisher/publish.mjs
      - name: Save the new pages
        run: |
          git config user.name "jora-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; else git commit -m "Publish office-panel articles and pages" && git push; fi
