<path d="M84 76 C120 62 182 72 204 100 C198 128 150 140 108 130 C84 124 72 104 84 76Z" fill="url(#skWing)"/>
<path d="M84 76 C120 62 182 72 204 100 C198 128 150 140 108 130 C84 124 72 104 84 76Z" fill="url(#skSpots)" opacity=".9"/>
<path d="M104 98 C134 92 170 98 196 108 M100 112 C132 108 166 114 190 122" stroke="#4a3018" stroke-width="2" fill="none" opacity=".6"/>
