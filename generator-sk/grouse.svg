<path d="M196 104 L262 70 L250 92 L272 96 L214 128 Z" fill="#7a5530"/>
<path d="M206 112 L262 86 L224 128 Z" fill="#f2ead9"/>
<path d="M214 104 L256 80" stroke="#4a3018" stroke-width="2"/>
<!-- body -->
<path d="M30 92 C40 52 96 44 150 58 C192 68 220 92 218 122 C216 160 176 182 120 182 C70 182 34 160 26 128 C24 116 26 104 30 92Z" fill="url(#skBody)"/>
<path d="M30 92 C40 52 96 44 150 58 C192 68 220 92 218 122 C216 160 176 182 120 182 C70 182 34 160 26 128 C24 116 26 104 30 92Z" fill="url(#skChev)" opacity=".7"/>
<path d="M44 130 C64 166 120 178 168 166 C140 182 80 184 46 156Z" fill="#f4ecdc"/>
<path d="M40 118 C60 160 116 176 170 164 C150 176 82 180 48 152Z" fill="url(#skBelly)"/>
