<path d="M58 66 C46 46 42 26 50 12 C58 -2 78 -4 90 4 C100 12 102 26 98 40 C96 52 92 62 86 70Z" fill="#9a7244"/>
<path d="M58 66 C46 46 42 26 50 12 C58 -2 78 -4 90 4 C100 12 102 26 98 40 C96 52 92 62 86 70Z" fill="url(#skChev)" opacity=".55"/>
<path d="M54 44 C62 54 78 58 92 52 C88 64 70 70 58 64Z" fill="#efe5d2"/>
<path d="M60 10 C66 0 82 -2 90 6 C82 4 70 6 60 10Z" fill="#5b3c1e"/>
<!-- yellow comb, eye, bill -->
<path d="M62 14 C66 8 76 7 82 12 C76 12 68 13 62 14Z" fill="#f2c230"/>
<circle cx="70" cy="20" r="4.2" fill="#2a1a0c"/><circle cx="71.4" cy="18.8" r="1.3" fill="#fff"/>
<path d="M50 22 L38 27 L50 30Z" fill="#3a2a1a"/>
<path d="M60 30 C66 34 74 34 80 30" stroke="#f5efe2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</g>
<!-- grass in front -->
<g stroke="#6d4a17" stroke-width="2.4" stroke-linecap="round" opacity=".9">
<path d="M150 400 q6-40 -2-74"/><path d="M168 400 q-4-34 8-66"/><path d="M360 400 q4-38 -6-70"/><path d="M380 400 q-2-30 8-58"/><path d="M262 400 q2-24 -4-44"/>
</g>
<text x="500" y="384" text-anchor="end" font-family="Roboto Condensed,Arial" font-weight="800" font-size="13" fill="#fff8e6" opacity=".95" letter-spacing=".08em">SHARP-TAILED GROUSE · SASKATCHEWAN</text>
</svg>
