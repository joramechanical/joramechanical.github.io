<title>Jora Mechanical Systems</title>
<meta name="description" content="Jora Mechanical Systems: furnaces, air conditioners, heat pumps, tankless water heaters, air handlers, duct work, HRV/ERV, plumbing and commercial HVAC across the GTA and Windsor to Montreal. Call 905-667-2823.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --or:#F96302;--or-d:#D45200;--or-l:#FFF1E8;--red:#D7262B;--red-l:#FDECEC;
  --ink:#333;--ink2:#1E1E1E;--mut:#666;--line:#DDD;--bg:#F5F5F5;--white:#fff;--ok:#2E7D32;
  --hd:"Roboto Condensed","Arial Narrow",Arial,sans-serif;--bd:Roboto,"Helvetica Neue",Arial,sans-serif;
  --hdr:150px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--hdr)}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.55 var(--bd);overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit}img{max-width:100%}
h1,h2,h3{font-family:var(--hd);font-weight:800;line-height:1.08;margin:0;color:var(--ink2)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:3px;border:2px solid var(--or);background:var(--or);color:#fff;font:700 15px/1 var(--bd);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:hover{background:var(--or-d);border-color:var(--or-d);transform:translateY(-1px);box-shadow:0 6px 14px rgba(249,99,2,.3)}
.btn.o{background:#fff;color:var(--or)}.btn.o:hover{background:var(--or-l)}
.btn.k{background:var(--ink2);border-color:var(--ink2)}.btn.k:hover{background:#000;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.btn.r{background:var(--red);border-color:var(--red)}.btn.r:hover{background:#B51E22;box-shadow:0 6px 14px rgba(215,38,43,.3)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.g{background:#fff;color:var(--ink);border-color:#bbb}.btn.g:hover{border-color:var(--ink);background:#fafafa;box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.sec{padding:56px 0}.sec.g{background:var(--bg)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:24px}
.sh h2{font-size:clamp(26px,3.4vw,38px);text-transform:uppercase}
.sh h2 em{font-style:normal;color:var(--or)}
.sh p{margin:6px 0 0;color:var(--mut);max-width:60ch}
.kick{display:inline-block;font:800 12px var(--hd);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.reveal{opacity:0;transform:translateY(26px) perspective(800px) rotateX(6deg);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* strip + header */
.strip{background:var(--ink2);color:#fff;font-size:13px}
.strip .wrap{display:flex;justify-content:space-between;align-items:center;gap:6px 18px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.strip b{color:var(--or)}.strip a{text-decoration:none;font-weight:700}
.pill-r{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:700;padding:3px 9px;border-radius:2px}
.pill-r i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hdr{position:sticky;top:0;z-index:60;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo search acts";gap:12px 18px;align-items:center;padding-top:10px;padding-bottom:10px}
.logo{grid-area:logo;display:flex;align-items:center;gap:12px;text-decoration:none}
.logo b{display:block;font:800 19px/1.05 var(--hd);text-transform:uppercase;color:var(--ink2)}
.logo small{display:block;font:700 11px/1.2 var(--bd);letter-spacing:.12em;color:var(--or);text-transform:uppercase;margin-top:3px}
/* 3D logo slab */
.l3d{display:inline-block;--s:62px;--d:12px;width:var(--s);height:var(--s);perspective:420px;flex:none}
.l3d .slab{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:slab 7s ease-in-out infinite}
.logo:hover .slab,.l3d:hover .slab{animation-play-state:paused;transform:rotateY(-24deg) rotateX(10deg)}
.slab>span{position:absolute;display:block;background:var(--or-d)}
.slab .f{inset:0;transform:translateZ(calc(var(--d)/2));background:var(--or);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.slab .f img{width:100%;height:100%;object-fit:contain;display:block}
.slab .f::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.slab .bk{inset:0;transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:#A84100}
.slab .lt,.slab .rt{top:0;bottom:0;width:var(--d);left:calc(50% - var(--d)/2)}
.slab .lt{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));background:#B84800}
.slab .rt{transform:rotateY(90deg) translateZ(calc(var(--s)/2));background:#9E3D00}
.slab .tp,.slab .bt{left:0;right:0;height:var(--d);top:calc(50% - var(--d)/2)}
.slab .tp{transform:rotateX(90deg) translateZ(calc(var(--s)/2));background:#FF8A3D}
.slab .bt{transform:rotateX(-90deg) translateZ(calc(var(--s)/2));background:#8A3500}
@keyframes slab{0%,100%{transform:rotateY(-22deg) rotateX(8deg)}50%{transform:rotateY(22deg) rotateX(-4deg)}}
.search{grid-area:search;position:relative}
.search form{display:flex;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:#fff}
.search form:focus-within{border-color:var(--or)}
.search input{flex:1;min-width:0;border:0;padding:0 14px;height:46px;font:400 16px var(--bd);color:var(--ink);background:#fff}
.search input:focus{outline:none}
.search button{width:56px;border:0;background:var(--or);color:#fff;cursor:pointer;display:grid;place-items:center}
.search button:hover{background:var(--or-d)}
.search button svg{width:22px;height:22px}
.res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.18);z-index:80;max-height:min(70vh,460px);overflow:auto}
.res[hidden]{display:none}
.res h4{margin:0;padding:10px 14px 4px;font:700 11px var(--bd);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.res button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px;cursor:pointer}
.res button:hover,.res button.on{background:var(--or-l)}
.res .ri{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--bg);color:var(--or);overflow:hidden}
.res .ri img{width:100%;height:100%;object-fit:contain}
.res .ri svg{width:22px;height:22px}
.res b{display:block;font-weight:700;font-size:14.5px}.res small{color:var(--mut);font-size:12.5px}
.res .none{padding:14px;color:var(--mut);font-size:14px}
.acts{grid-area:acts;display:flex;gap:10px;align-items:center}
.acts .call{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;text-align:right}
.acts .call small{font-size:12px;color:var(--mut)}.acts .call b{font:800 20px var(--hd);color:var(--ink2)}
.nav{border-top:1px solid var(--line);background:#fff}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav ul button,.nav ul a{all:unset;cursor:pointer;display:block;padding:11px 13px;font:700 14px var(--bd);white-space:nowrap;color:var(--ink);border-bottom:3px solid transparent}
.nav ul button:hover,.nav ul a:hover{color:var(--or);border-bottom-color:var(--or)}
.nav .hot{color:var(--red)}
@media(max-width:900px){.bar{grid-template-columns:1fr auto;grid-template-areas:"logo acts" "search search"}.acts .call{display:none}.l3d{--s:50px;--d:10px}.logo b{font-size:16px}}
@media(max-width:420px){.acts .btn span{display:none}.acts .btn{padding:0 13px}.logo small{display:none}}

/* hero */
.jx-hero{position:relative;overflow:hidden;overflow:clip;isolation:isolate;min-height:calc(100svh - var(--hdr));display:flex;align-items:center;
  background:radial-gradient(900px 560px at 72% 52%,rgba(var(--jx-glow),.18),transparent 62%),radial-gradient(600px 400px at 0% 100%,rgba(215,38,43,.07),transparent 60%),linear-gradient(180deg,#fff 0%,#F2F2F2 100%);
  border-bottom:1px solid var(--line);--jx-glow:249,99,2}
.jx-hero::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:46%;z-index:-1;background-image:linear-gradient(#e0e0e0 1px,transparent 1px),linear-gradient(90deg,#e0e0e0 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);transform:perspective(700px) rotateX(55deg);transform-origin:bottom}
.jx-ghost{position:absolute;left:62%;top:44%;transform:translate(-50%,-50%);z-index:-1;white-space:nowrap;pointer-events:none;font:900 clamp(80px,15vw,240px)/1 var(--hd);letter-spacing:-.03em;color:transparent;-webkit-text-stroke:2px rgba(0,0,0,.06);transition:opacity .4s}
.jx-wrap{width:100%;max-width:1280px;margin:0 auto;padding:clamp(18px,3vw,40px) 16px 24px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:center}
.jx-copy{position:relative;z-index:3}
.jx-tabs{display:inline-flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.jx-tab{all:unset;cursor:pointer;font:700 13px/1 var(--bd);padding:10px 14px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:3px}
.jx-tab:hover{border-color:var(--or);color:var(--or)}
.jx-tab[aria-selected=true]{background:var(--or);border-color:var(--or);color:#fff}
.jx-brand{display:inline-block;background:var(--ink2);color:#fff;font:800 13px/1 var(--hd);letter-spacing:.14em;text-transform:uppercase;padding:7px 10px}
.jx-title{font:800 clamp(34px,4.8vw,64px)/1.02 var(--hd);text-transform:uppercase;margin:14px 0 12px;color:var(--ink2)}
.jx-title span{color:var(--or)}
.jx-desc{color:var(--mut);font-size:clamp(15px,1.3vw,17px);max-width:44ch;margin:0 0 18px}
.jx-feats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.jx-feats li{font:500 13.5px/1 var(--bd);padding:9px 12px;background:#fff;border:1px solid var(--line);display:flex;gap:7px;align-items:center}
.jx-feats li::before{content:"✓";color:var(--or);font-weight:900}
.jx-ctas{display:flex;gap:10px;flex-wrap:wrap}
.jx-anim>*{transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.jx-anim.out>*{opacity:0;transform:translateY(12px)}
.jx-stage{position:relative;height:clamp(400px,62svh,600px);perspective:1700px;perspective-origin:50% 40%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.jx-floor{position:absolute;left:50%;bottom:10%;width:min(620px,92%);aspect-ratio:3.4;transform:translateX(-50%);pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.22) 0%,rgba(0,0,0,.06) 42%,transparent 70%);filter:blur(3px)}
.jx-ring{position:absolute;left:50%;bottom:12%;width:min(400px,70%);aspect-ratio:3.6;transform:translateX(-50%);pointer-events:none;border-radius:50%;border:3px solid var(--or);box-shadow:0 0 22px rgba(249,99,2,.45)}
.jx-ring::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px dashed rgba(215,38,43,.35);animation:jxspin 30s linear infinite}
@keyframes jxspin{to{transform:rotate(360deg)}}
.jx-track{position:absolute;inset:0;transform-style:preserve-3d}
.jx-slide{position:absolute;left:50%;bottom:15%;width:min(330px,46%);height:76%;margin-left:calc(min(330px,46%) / -2);display:flex;align-items:flex-end;justify-content:center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.75,.15,1),opacity .6s,filter .6s;will-change:transform}
.jx-tilt{position:relative;height:100%;width:100%;display:flex;align-items:flex-end;justify-content:center;transition:transform .25s ease-out;transform-style:preserve-3d}
.jx-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 26px 26px rgba(0,0,0,.28)) drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.jx-slide.wide img{max-height:68%}
.jx-reflect{position:absolute;left:0;right:0;top:100%;height:34%;display:flex;justify-content:center;transform:scaleY(-1);opacity:.16;pointer-events:none;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 60%);mask-image:linear-gradient(to top,#000 0%,transparent 60%)}
.jx-reflect img{filter:blur(1.5px);max-height:none;height:auto;align-self:flex-start}
.jx-slide:not(.on) .jx-reflect{opacity:.05}
.jx-badge{position:absolute;top:6%;right:-6%;z-index:2;background:var(--or);color:#fff;padding:9px 12px;font:700 12px/1.15 var(--bd);opacity:0;transform:translateZ(60px) translateY(8px);transition:.5s .3s;box-shadow:0 8px 18px rgba(249,99,2,.35)}
.jx-badge.red{background:var(--red);box-shadow:0 8px 18px rgba(215,38,43,.35)}
.jx-badge b{display:block;font:800 17px/1.05 var(--hd);text-transform:uppercase}
.jx-slide.on .jx-badge{opacity:1;transform:translateZ(60px)}
.jx-controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:5}
.jx-arrow{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);color:var(--ink)}
.jx-arrow:hover{background:var(--or);border-color:var(--or);color:#fff}
.jx-arrow svg{width:18px;height:18px}
.jx-dots{display:flex;gap:6px;align-items:center}
.jx-dot{all:unset;cursor:pointer;width:9px;height:9px;border-radius:99px;background:#c8c8c8;transition:.35s;position:relative;overflow:hidden}
.jx-dot.on{width:34px;background:#ddd}
.jx-dot.on::after{content:"";position:absolute;inset:0;background:var(--or);transform-origin:left;animation:jxprog var(--jx-dur,6s) linear forwards}
.jx-hero.paused .jx-dot.on::after{animation-play-state:paused}
@keyframes jxprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.jx-count{font:800 14px/1 var(--hd);color:var(--mut);min-width:54px;text-align:center}.jx-count b{color:var(--ink2);font-size:19px}
.scroll-cue{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:700 11px var(--bd);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none}
.scroll-cue i{width:2px;height:22px;background:linear-gradient(var(--or),transparent);animation:cue 1.6s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:980px){.jx-hero{min-height:0}.jx-wrap{grid-template-columns:1fr}.jx-stage{order:-1;height:400px}.jx-copy{text-align:center}.jx-desc{margin-inline:auto}.jx-feats,.jx-ctas,.jx-tabs{justify-content:center}.jx-ghost{left:50%;top:24%}.scroll-cue{display:none}}
@media(max-width:560px){.jx-stage{height:340px}.jx-slide{width:58%;margin-left:-29%;height:70%}.jx-tab{padding:9px 10px;font-size:12px}.jx-title{font-size:31px}.jx-ctas .btn{flex:1}.jx-badge{right:-2%}.jx-feats li:nth-child(3){display:none}}

/* quick services */
.qs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;perspective:900px}
.qb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;background:#fff;border:1px solid var(--line);padding:16px 6px;min-height:112px;font:700 13.5px/1.2 var(--bd);color:var(--ink);transition:border-color .2s,box-shadow .2s,transform .2s;transform-style:preserve-3d}
.qb:hover{border-color:var(--or);box-shadow:0 14px 26px rgba(0,0,0,.12);transform:translateY(-4px) rotateX(8deg)}
.qb .ic{width:48px;height:48px;border-radius:50%;background:var(--or-l);color:var(--or);display:grid;place-items:center;transition:.2s;transform:translateZ(20px)}
.qb:hover .ic{background:var(--or);color:#fff}
.qb .ic svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qb.red .ic{background:var(--red);color:#fff}.qb.red{border-color:#f3c2c3}
@media(max-width:1100px){.qs{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:700px){.qs{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:480px){.qs{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.qb{min-height:92px;font-size:11px;padding:10px 2px;gap:6px}.qb .ic{width:40px;height:40px}.qb .ic svg{width:21px;height:21px}}

/* licences */
.lic{background:var(--ink2);color:#fff;padding:40px 0;overflow:hidden;position:relative}
.lic::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--or),var(--red))}
.lic .sh h2{color:#fff}.lic .sh p{color:#bdbdbd}
.lic-view{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);perspective:900px}
.lic-track{display:flex;gap:14px;width:max-content;animation:licmove 44s linear infinite;padding:8px 0}
.lic-view:hover .lic-track{animation-play-state:paused}
@keyframes licmove{to{transform:translateX(-50%)}}
.lc{flex:none;width:260px;display:flex;gap:12px;align-items:center;background:#2B2B2B;border:1px solid #444;border-left:5px solid var(--or);padding:14px;transition:transform .3s}
.lc:nth-child(3n+2){border-left-color:var(--red)}
.lc:hover{transform:rotateY(-10deg) translateZ(20px)}
.lc .seal{width:54px;height:54px;flex:none}
.lc b{display:block;font:800 16px/1.15 var(--hd);text-transform:uppercase}
.lc small{display:block;color:#bdbdbd;font-size:12.5px;line-height:1.35;margin-top:3px}

/* map band */
.mapband{background:#030b1c;padding:48px 0 36px}
.mapband .sh{max-width:1280px;margin:0 auto 20px;padding:0 16px}
.mapband .sh h2{color:#fff}.mapband .sh p{color:#9db6dc}
.mapfull{width:100%;padding:0 clamp(0px,1.5vw,16px)}

/* process */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(5,minmax(0,1fr));counter-reset:st}
.steps li{position:relative;background:#fff;border:1px solid var(--line);padding:22px 16px 18px;counter-increment:st;transition:transform .25s,box-shadow .25s}
.steps li:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.1)}
.steps .n{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.steps .n::before{content:counter(st);width:34px;height:34px;background:var(--or);color:#fff;display:grid;place-items:center;font:800 17px var(--hd);box-shadow:3px 3px 0 var(--ink2)}
.steps li:nth-child(2n) .n::before{background:var(--red)}
.steps .n svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-left:auto}
.steps b{display:block;font:800 17px/1.15 var(--hd);text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.steps p{margin:0;color:var(--mut);font-size:14px}
@media(max-width:980px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* team */
.team{display:grid;gap:36px;grid-template-columns:1.1fr .9fr;align-items:center}
.collage{position:relative;height:clamp(360px,42vw,500px);perspective:1200px}
.ph3{position:absolute;background:#fff;padding:8px 8px 34px;box-shadow:0 18px 40px rgba(0,0,0,.22);transition:transform .5s cubic-bezier(.2,.8,.2,1),z-index 0s .2s;transform-style:preserve-3d;cursor:pointer}
.ph3 .img{width:100%;height:100%;overflow:hidden;background:#2B2B2B;position:relative}
.ph3 .img img,.ph3 .img svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph3 figcaption{position:absolute;left:10px;right:10px;bottom:8px;font:800 13px var(--hd);text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
